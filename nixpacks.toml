[phases.setup]
cmds = ["python -m venv .venv"]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [". .venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "export PATH=\"$(pwd)/.venv/bin:$PATH\"; if [ \"${SERVICE_ROLE:-web}\" = \"worker\" ]; then python worker.py; else gunicorn -c gunicorn.conf.py app:app; fi"
