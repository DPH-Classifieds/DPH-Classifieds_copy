[phases.setup]
nixPkgs = ["python311Full", "gcc", "tesseract4"]
aptPkgs = ["tesseract-ocr"]

[phases.install]
cmds = [
  "python -m venv .venv && . .venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". .venv/bin/activate && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu",
  ". .venv/bin/activate && pip install -r requirements.txt",
  "TBIN=$(which tesseract 2>/dev/null || find /nix/store -maxdepth 4 -name tesseract -type f 2>/dev/null | head -1); [ -n \"$TBIN\" ] && ln -sf \"$TBIN\" /usr/local/bin/tesseract && echo \"tesseract symlinked: $TBIN\" || echo 'WARNING: tesseract binary not found'",
  ". .venv/bin/activate && EASYOCR_MODEL_DIR=/app/easyocr_models python download_ocr_models.py",
]

[start]
cmd = "sh -lc 'export PATH=\"/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$(pwd)/.venv/bin:$PATH\"; export EASYOCR_MODEL_DIR=\"${EASYOCR_MODEL_DIR:-/app/easyocr_models}\"; export TESSERACT_CMD=\"${TESSERACT_CMD:-/usr/bin/tesseract}\"; if [ \"${SERVICE_ROLE:-web}\" = \"worker\" ]; then exec python worker.py; else exec gunicorn -c gunicorn.conf.py app:app; fi'"
