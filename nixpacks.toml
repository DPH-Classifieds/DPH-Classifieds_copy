[phases.setup]
nixPkgs = ["python311Full", "gcc", "tesseract4"]

[phases.install]
cmds = [
  "python -m venv .venv && . .venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". .venv/bin/activate && pip install torch --index-url https://download.pytorch.org/whl/cpu",
  ". .venv/bin/activate && pip install -r flask-react-supabase-app/backend/requirements.txt",
  "TBIN=$(which tesseract 2>/dev/null || find /nix/store -maxdepth 4 -name tesseract -type f 2>/dev/null | head -1); [ -n \"$TBIN\" ] && ln -sf \"$TBIN\" /usr/local/bin/tesseract && echo \"tesseract symlinked: $TBIN\" || echo 'WARNING: tesseract binary not found'",
  ". .venv/bin/activate && EASYOCR_MODEL_DIR=/app/easyocr_models python flask-react-supabase-app/backend/download_ocr_models.py",
]

[start]
cmd = "export PATH=\"$(pwd)/.venv/bin:$PATH\"; if [ \"${SERVICE_ROLE:-web}\" = \"worker\" ]; then if [ -f worker.py ]; then python worker.py; elif [ -f flask-react-supabase-app/backend/worker.py ]; then cd flask-react-supabase-app/backend && python worker.py; else echo 'worker.py not found' && exit 1; fi; else if [ -f app.py ]; then gunicorn -c gunicorn.conf.py app:app; elif [ -f flask-react-supabase-app/backend/app.py ]; then gunicorn -c flask-react-supabase-app/backend/gunicorn.conf.py --chdir flask-react-supabase-app/backend app:app; else echo 'app.py not found' && exit 1; fi; fi"
