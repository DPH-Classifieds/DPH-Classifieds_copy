[phases.setup]
cmds = ["python -m venv .venv"]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [". .venv/bin/activate && pip install -r flask-react-supabase-app/backend/requirements.txt"]

[start]
cmd = "export PATH=\"$(pwd)/.venv/bin:$PATH\"; if [ \"${SERVICE_ROLE:-web}\" = \"worker\" ]; then python flask-react-supabase-app/backend/worker.py; else gunicorn -c flask-react-supabase-app/backend/gunicorn.conf.py --chdir flask-react-supabase-app/backend app:app; fi"
