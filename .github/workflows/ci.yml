name: Classifieds CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-react-supabase-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flask-react-supabase-app/backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-cov
      - run: pytest -q

  frontend:
    name: Frontend tests and bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-react-supabase-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: flask-react-supabase-app/frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false --runInBand
      - run: npm run build
      - run: npm run check:bundle

  mobile:
    name: Mobile typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-react-supabase-app/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: flask-react-supabase-app/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --watch=false

  docker-e2e:
    name: Docker API E2E
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: ./e2e/run.sh
        working-directory: flask-react-supabase-app/backend
      - run: ./e2e/worker.sh
        working-directory: flask-react-supabase-app/backend
